# Ghostty keys for this Neovim setup. install.sh adds this file to your Ghostty
# config with a `config-file = ...` line, so edits here apply on Cmd+S then R.
#
# Hand these VS Code shortcuts to Neovim. Outside Neovim (in the shell) they do
# nothing, because Ghostty sends no text for unbound Cmd keys on macOS.
keybind = super+shift+p=unbind
keybind = super+shift+f=unbind
keybind = super+f=unbind
keybind = super+z=unbind
keybind = super+shift+z=unbind

# Ghostty's own versions move under the Cmd+S prefix
keybind = cmd+s>p=toggle_command_palette
keybind = cmd+s>f=start_search
keybind = cmd+s>u=undo
keybind = cmd+s>shift+u=redo
